name: Show Generate report immediately

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/make-3cx-optional.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          old_upload = '''cx_file = c3.file_uploader("3CX calls (optional)", type=["csv", "xlsx", "xls", "zip"], help="Leave blank to generate the sales and marketing report without call KPIs.")\n\nif not all((dt_file, wp_file)):\n    st.info("Upload DoubleTick leads and Workpex converted orders. 3CX is optional. Meta spend is fetched directly with META_ACCESS_TOKEN.")\n    st.markdown("**Accepted:** CSV, Excel or ZIP containing CSV/Excel. The app will propose column mappings before processing.")\n    st.stop()'''
          new_upload = '''cx_file = c3.file_uploader("3CX calls (optional)", type=["csv", "xlsx", "xls", "zip"], help="Leave blank to generate the sales and marketing report without call KPIs.")\n\nif not all((dt_file, wp_file)):\n    st.info("Upload DoubleTick leads and Workpex converted orders. 3CX is optional. Meta spend is fetched directly with META_ACCESS_TOKEN.")\n    st.markdown("**Accepted:** CSV, Excel or ZIP containing CSV/Excel.")\n    st.stop()\n\ngenerate_requested = st.button("Generate report", type="primary", use_container_width=True)\nif not generate_requested:\n    st.caption("Files are ready. Click Generate report to start reading and processing them.")\n    st.stop()'''

          old_button = 'submitted = st.button("Generate report", type="primary", use_container_width=True)'
          new_button = 'submitted = generate_requested'

          if old_upload not in text:
              raise SystemExit('Upload block not found')
          if old_button not in text:
              raise SystemExit('Existing Generate report button not found')

          text = text.replace(old_upload, new_upload, 1)
          text = text.replace(old_button, new_button, 1)
          path.write_text(text, encoding='utf-8')
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Commit dashboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Show Generate report before parsing large uploads"
          git push
