name: Fix historical KPI layout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/make-3cx-optional.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          old_meta = '            meta_kpis = st.columns(2)'
          new_meta = '            meta_kpis = st.columns(4)'
          old_organic = '            organic_kpis = st.columns(2)'
          new_organic = '            organic_kpis = st.columns(4)'

          if old_meta not in text:
              raise SystemExit('Meta KPI layout line not found')
          if old_organic not in text:
              raise SystemExit('Organic KPI layout line not found')

          text = text.replace(old_meta, new_meta, 1)
          text = text.replace(old_organic, new_organic, 1)
          path.write_text(text, encoding='utf-8')
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Commit dashboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix historical KPI column counts"
          git push
