name: Persist historical dashboard data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/make-3cx-optional.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make historical cache persistent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          history_path = Path('historical_business.py')
          history = history_path.read_text(encoding='utf-8')
          history = history.replace(
              '@st.cache_data(ttl=21600, show_spinner=False)\ndef load_historical_business()',
              '@st.cache_resource(show_spinner=False)\ndef load_historical_business()',
              1,
          )
          history_path.write_text(history, encoding='utf-8')

          page_path = Path('pages/01_Historical_Business.py')
          page = page_path.read_text(encoding='utf-8')
          old = '''if "historical_business_data" not in st.session_state:
    try:
        with st.spinner("Loading the 2024–2026 monthly leads and Sales CRM sheets…"):
            st.session_state["historical_business_data"] = load_historical_business()
    except Exception as exc:
        st.error(f"Could not load historical business sources: {exc}")
        st.stop()

historical_leads, historical_crm = st.session_state["historical_business_data"]'''
          new = '''try:
    with st.spinner("Loading historical data once and keeping it available in memory…"):
        historical_leads, historical_crm = load_historical_business()
except Exception as exc:
    st.error(f"Could not load historical business sources: {exc}")
    st.stop()'''
          if old in page:
              page = page.replace(old, new, 1)
          page = page.replace(
              'status_col.info("Lead count for Meta CPL uses only Customer Path = LEAD. Missed Lead, Broadcast and Re-Order remain separate business metrics.")',
              'status_col.info("Historical data is loaded once and retained in the shared app cache. Month and year changes reuse the cached dataset without downloading the Google Sheets again.")',
              1,
          )
          page_path.write_text(page, encoding='utf-8')

          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')
          old_app = '''if "historical_business_data" not in st.session_state:
        try:
            with st.spinner("Loading historical leads and Sales CRM sources…"):
                st.session_state["historical_business_data"] = load_historical_business()
        except Exception as exc:
            st.error(f"Could not load historical business sources: {exc}")
            st.stop()

    historical_leads, historical_crm = st.session_state["historical_business_data"]'''
          new_app = '''try:
        with st.spinner("Loading historical data once and keeping it available in memory…"):
            historical_leads, historical_crm = load_historical_business()
    except Exception as exc:
        st.error(f"Could not load historical business sources: {exc}")
        st.stop()'''
          if old_app in app:
              app = app.replace(old_app, new_app, 1)
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile app.py historical_business.py pages/01_Historical_Business.py

      - name: Commit cache update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_business.py pages/01_Historical_Business.py app.py
          if git diff --cached --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "Keep historical dashboard data loaded in shared cache"
            git push
          fi
