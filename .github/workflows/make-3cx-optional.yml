name: Fix historical year and month navigation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/make-3cx-optional.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch historical navigation
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from meta_spend import META_AD_ACCOUNTS, fetch_meta_spend, monthly_spend_summary\n'
          import_line = 'from historical_business import load_historical_business, render_historical_business\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = '''if analysis_mode == "Historical business analysis":
