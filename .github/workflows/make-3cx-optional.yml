name: Apply historical CRM hotfix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/make-3cx-optional.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace unsafe secondary phone matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('historical_business.py')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'    missing = result\["crm_outcome"\]\.isna\(\) & result\["phone_2"\]\.ne\(""\)\n'
              r'    if missing\.any\(\):\n'
              r'        secondary = leads\.loc\[missing\]\.merge\(\n'
              r'            crm_one\[\["month", "match_phone", "crm_outcome", "crm_status_raw", "crm_value", "reason", "source_row_crm"\]\],\n'
              r'            left_on=\["month", "phone_2"\], right_on=\["month", "match_phone"\], how="left",\n'
              r'        \)\n'
              r'        for column in \["crm_outcome", "crm_status_raw", "crm_value", "reason", "source_row_crm"\]:\n'
              r'            result\.loc\[missing, column\] = secondary\[column\]\.to_numpy\(\)'
          )

          replacement = '''    missing = result["crm_outcome"].isna() & result["phone_2"].ne("")
    if missing.any():
        missing_rows = result.loc[missing, ["month", "phone_2"]].copy()
        secondary = missing_rows.merge(
            crm_one[["month", "match_phone", "crm_outcome", "crm_status_raw", "crm_value", "reason", "source_row_crm"]],
            left_on=["month", "phone_2"], right_on=["month", "match_phone"], how="left", sort=False,
        )
        secondary.index = missing_rows.index
        for column in ["crm_outcome", "crm_status_raw", "crm_value", "reason", "source_row_crm"]:
            result.loc[missing_rows.index, column] = secondary[column].reindex(missing_rows.index)'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one unsafe CRM matching block, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate hotfix
        run: |
          python -m py_compile historical_business.py
          grep -q 'missing_rows = result.loc' historical_business.py
          ! grep -q 'secondary = leads.loc\[missing\]' historical_business.py

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_business.py
          git commit -m "Apply direct historical CRM matching hotfix"
          git push
