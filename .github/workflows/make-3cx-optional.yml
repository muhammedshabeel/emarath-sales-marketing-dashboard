              raise SystemExit('Old historical block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'help="Historical mode reads the January 2025 onward CRM workbook. Current operations uses DoubleTick and 3CX uploads.",',
              'help="Historical mode covers 2024, 2025 and January–April 2026 using leads sheets, Sales CRM and live Meta spend.",',
              1,
          )
          text = text.replace('HISTORICAL_SCHEMA_VERSION = 2', 'HISTORICAL_SCHEMA_VERSION = 4', 1)
          path.write_text(text, encoding='utf-8')
      - name: Validate Python syntax
        run: python -m py_compile app.py historical_business.py
      - name: Commit navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Improve historical year and month navigation"
          git push
