name: Fix historical CRM matching

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/make-3cx-optional.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix unalignable boolean index in CRM matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('historical_business.py')
          text = path.read_text(encoding='utf-8')

          old = '''    missing = result["crm_outcome"].isna() & result["phone_2"].ne("")
    if missing.any():
        secondary = leads.loc[missing].merge(
            crm_one[["month", "match_phone", "crm_outcome", "crm_status_raw", "crm_value", "reason", "source_row_crm"]],
            left_on=["month", "phone_2"], right_on=["month", "match_phone"], how="left",
        )
        for column in ["crm_outcome", "crm_status_raw", "crm_value", "reason", "source_row_crm"]:
            result.loc[missing, column] = secondary[column].to_numpy()'''

          new = '''    missing = result["crm_outcome"].isna() & result["phone_2"].ne("")
    if missing.any():
        missing_positions = result.index[missing]
        secondary_source = result.loc[missing_positions, ["month", "phone_2"]].copy()
        secondary = secondary_source.merge(
            crm_one[["month", "match_phone", "crm_outcome", "crm_status_raw", "crm_value", "reason", "source_row_crm"]],
            left_on=["month", "phone_2"], right_on=["month", "match_phone"], how="left", sort=False,
        )
        secondary.index = missing_positions
        for column in ["crm_outcome", "crm_status_raw", "crm_value", "reason", "source_row_crm"]:
            result.loc[missing_positions, column] = secondary[column]'''

          if old not in text:
              raise SystemExit('Expected CRM matching block not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate syntax
        run: python -m py_compile historical_business.py app.py pages/01_Historical_Business.py

      - name: Run CRM matching regression test
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from historical_business import match_crm

          leads = pd.DataFrame({
              'month': ['2025-12', '2025-12'],
              'phone': ['111', '222'],
              'phone_2': ['999', ''],
          })
          crm = pd.DataFrame({
              'month': ['2025-12'],
              'phone': ['999'],
              'phone_2': [''],
              'crm_outcome': ['SALE CLOSED'],
              'crm_status_raw': ['Delivered'],
              'crm_value': [100.0],
              'reason': [''],
              'source_row_crm': [2],
          })
          out = match_crm(leads, crm)
          assert out.loc[0, 'crm_outcome'] == 'SALE CLOSED'
          assert out.loc[1, 'crm_outcome'] == 'NOT FOUND IN CRM'
          print('CRM matching regression test passed')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_business.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix historical CRM secondary phone matching"
            git push
          fi
